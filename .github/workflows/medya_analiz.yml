name: Günlük Medya Anlatı Analizi

on:
  push:
    branches: [ "main" ] # Koda herhangi bir güncelleme geldiğinde çalışır
  workflow_dispatch:      # GitHub paneli üzerinden elinizle (manuel) tetikleme butonu açar
  schedule:
    - cron: '0 7 * * *'  # Her gün Türkiye saatiyle sabah 10:00'da otomatik çalışır (UTC 07:00)

jobs:
  medya_raporlama:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Python Ortamını Hazırla
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Analiz Scriptini Tetikle
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python analiz_yap.py

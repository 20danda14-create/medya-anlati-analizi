name: Günlük Medya Anlatı Analizi

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:      
  schedule:
    - cron: '0 7 * * *'  

# GitHub Pages'e yükleme yapabilmesi için gerekli izinler
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  medya_raporlama:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4.2.2

    - name: Python Ortamını Hazırla
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.10'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Analiz Scriptini Tetikle
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python analiz_yap.py

    # YENİ ADIM: Oluşan index.html dosyasını depoya geri yükle ve deploy et
    - name: Web Sayfasını Depoya Commit Et
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add index.html
        git diff --quiet && git diff --staged --quiet || (git commit -m "Günlük rapor web sayfası güncellendi: $(date +'%d-%m-%Y')" && git push)

    # GitHub Pages altyapısını tetikle
    - name: Pages Ayarlarını Yükle
      uses: actions/configure-pages@v5

    - name: Artifact Oluştur
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: GitHub Pages Üzerinde Yayınla
      uses: actions/deploy-pages@v4
